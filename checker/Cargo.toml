[package]
name = "concord-check"
version = "0.1.0"
edition = "2024"
description = "A linearizability checker for key-value histories (Wing & Gong / Lowe, per key)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
fastrand = "2.5.0"

[profile.release]
debug = 1
